name: ml-api

on:
  push:
    branches: [main]
    paths:
      - "ml-api/**"
      - "data/**"
      - ".github/workflows/ml-api.yml"
  pull_request:
    paths:
      - "ml-api/**"
      - "data/**"
      - ".github/workflows/ml-api.yml"
  workflow_dispatch:

concurrency:
  group: ml-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/housing-prediction-ml-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Training jobs are stored in a throwaway MongoDB, never the Atlas cluster.
      mongo:
        # MongoDB 8.x refuses to start on the runners' Linux 6.19+ kernels; 7.0 has no such check.
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: ml-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    services:
      # Training jobs are stored in a throwaway MongoDB, never the Atlas cluster.
      mongo:
        # MongoDB 8.x refuses to start on the runners' Linux 6.19+ kernels; 7.0 has no such check.
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml-api/Dockerfile
          load: true
          tags: ml-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name ml-api --network host -e MONGODB_URI=mongodb://localhost:27017 ml-api:smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/health | grep -q '"model_loaded":true'
          curl -fs http://localhost:8000/health | grep -q '"database":"ok"'
          curl -fs -X POST http://localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"square_footage":1550,"bedrooms":3,"bathrooms":2,"year_built":1997,"lot_size":6800,"distance_to_city_center":4.1,"school_rating":7.6}'
          echo
          curl -fs -o /dev/null -w '%{http_code}\n' -F file=@data/House_Price_Dataset.csv http://localhost:8000/trainings | grep -q 202
          curl -fs http://localhost:8000/trainings | grep -q '"status"'
          docker logs ml-api

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
