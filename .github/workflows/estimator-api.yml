name: estimator-api

on:
  push:
    branches: [main]
    paths: ["estimator-api/**", ".github/workflows/estimator-api.yml"]
  pull_request:
    paths: ["estimator-api/**", ".github/workflows/estimator-api.yml"]
  workflow_dispatch:

concurrency:
  group: estimator-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/housing-prediction-estimator-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Tests run against a throwaway MongoDB, never the Atlas cluster.
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: estimator-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: estimator-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: estimator-api/Dockerfile
          load: true
          tags: estimator-api:smoke
          cache-from: type=gha,scope=estimator-api
          cache-to: type=gha,mode=max,scope=estimator-api
      - name: Smoke test container
        run: |
          docker run -d --name est --network host -e MONGODB_URI=mongodb://localhost:27017 \
            -e ML_API_URL=http://localhost:9 estimator-api:smoke
          for i in $(seq 1 30); do curl -fs http://localhost:8001/health && break; sleep 1; done
          echo
          # ml-api is deliberately absent: the service must stay up and report degraded.
          curl -fs http://localhost:8001/health | grep -q '"database":"ok"'
          curl -fs http://localhost:8001/health | grep -q '"ml_api":"unreachable"'
          docker logs est
      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: estimator-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=estimator-api
          cache-to: type=gha,mode=max,scope=estimator-api
